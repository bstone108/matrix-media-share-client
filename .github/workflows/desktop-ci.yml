name: Desktop CI

# macOS signing policy:
# - Pull requests and other non-release compiles stay unsigned. Do not import
#   the Developer ID cert, set MACOS_CODESIGN_IDENTITY, set
#   MACOS_REQUIRE_NOTARIZATION=1, or call notarytool/stapler.
# - Developer ID sign (hardened runtime + timestamp), notarize, and staple the
#   .app, .dmg, and zip only on a real release: a v* tag, or workflow_dispatch
#   that publishes GitHub Release files (same condition as publish-release).
# Path filters apply to pull requests only. Combining paths with tags: v* can
# skip a real tag release when the tagged commit's file diff does not match.

on:
  pull_request:
    paths:
      - ".github/workflows/desktop-ci.yml"
      - "ARM_BUILD_README.md"
      - "CMakeLists.txt"
      - "README.md"
      - "VERSION.txt"
      - "backend/**"
      - "build-linux-arm64.command"
      - "cmake/**"
      - "packaging/**"
      - "scripts/**"
      - "src/**"
      - "tests/**"
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  APP_NAME: MatrixMediaShareClientQt
  QT_VERSION: "6.10.2"
  VLC_VERSION: "3.0.23"

permissions:
  contents: read

jobs:
  build-linux:
    name: Build Linux AppImage (x86_64)
    runs-on: ubuntu-24.04
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Read version
        id: version
        run: echo "app_version=$(tr -d '\r\n' < VERSION.txt)" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install aqtinstall
        run: python3 -m pip install --user "aqtinstall==3.3.*" "py7zr==1.0.*"

      - name: Restore Rust cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('backend/Cargo.lock', 'backend/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Install system build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            curl \
            desktop-file-utils \
            libgl1-mesa-dev \
            libgstreamer-gl1.0-0 \
            libgstreamer-plugins-base1.0-0 \
            libgstreamer-plugins-bad1.0-0 \
            libgstreamer-plugins-good1.0-0 \
            libgstreamer1.0-0 \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-good \
            libpulse-dev \
            libpulse0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-util1 \
            libxcb-xfixes0 \
            libxcb-xkb1 \
            libxkbcommon-x11-0 \
            libvlc-bin \
            libvlc5 \
            ninja-build \
            patchelf \
            vlc-plugin-base \
            zip

      - name: Normalize bundled VLC runtime
        run: |
          multiarch="$(dpkg-architecture -qDEB_HOST_MULTIARCH)"
          VLC_ROOT="${RUNNER_TEMP}/vlc-runtime"
          mkdir -p "${VLC_ROOT}/lib" "${VLC_ROOT}/plugins"
          cp -a /usr/lib/${multiarch}/libvlc.so* "${VLC_ROOT}/lib/"
          cp -a /usr/lib/${multiarch}/libvlccore.so* "${VLC_ROOT}/lib/"
          cp -a /usr/lib/${multiarch}/vlc/plugins/. "${VLC_ROOT}/plugins/"
          echo "MATRIX_MEDIA_SHARE_CLIENT_BUNDLED_VLC_ROOT=${VLC_ROOT}" >> "$GITHUB_ENV"

      - name: Install Qt
        run: |
          QT_BASE_DIR="${RUNNER_TEMP}/qt"
          python3 -m aqt install-qt --outputdir "${QT_BASE_DIR}" linux desktop "${QT_VERSION}" linux_gcc_64 --modules qtmultimedia
          QT_ROOT_DIR="${QT_BASE_DIR}/${QT_VERSION}/gcc_64"
          echo "QT_ROOT_DIR=${QT_ROOT_DIR}" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=${QT_ROOT_DIR}" >> "$GITHUB_ENV"
          echo "${QT_ROOT_DIR}/bin" >> "$GITHUB_PATH"

      - name: Package AppImage
        run: ./scripts/package-appimage.sh

      - name: Upload AppImage
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.APP_NAME }}-${{ steps.version.outputs.app_version }}-linux-x86_64-appimage
          path: builds/${{ env.APP_NAME }}-${{ steps.version.outputs.app_version }}-linux-x86_64-appimage.zip
          if-no-files-found: error

  build-linux-arm64:
    name: Build Linux AppImage (arm64)
    runs-on: ubuntu-24.04-arm
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Read version
        id: version
        run: echo "app_version=$(tr -d '\r\n' < VERSION.txt)" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install aqtinstall
        run: python3 -m pip install --user "aqtinstall==3.3.*" "py7zr==1.0.*"

      - name: Restore Rust cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('backend/Cargo.lock', 'backend/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Install system build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            curl \
            desktop-file-utils \
            libgl1-mesa-dev \
            libgstreamer-gl1.0-0 \
            libgstreamer-plugins-base1.0-0 \
            libgstreamer-plugins-bad1.0-0 \
            libgstreamer-plugins-good1.0-0 \
            libgstreamer1.0-0 \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-good \
            libpulse-dev \
            libpulse0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-util1 \
            libxcb-xfixes0 \
            libxcb-xkb1 \
            libxkbcommon-x11-0 \
            libvlc-bin \
            libvlc5 \
            ninja-build \
            patchelf \
            vlc-plugin-base \
            zip

      - name: Normalize bundled VLC runtime
        run: |
          multiarch="$(dpkg-architecture -qDEB_HOST_MULTIARCH)"
          VLC_ROOT="${RUNNER_TEMP}/vlc-runtime"
          mkdir -p "${VLC_ROOT}/lib" "${VLC_ROOT}/plugins"
          cp -a /usr/lib/${multiarch}/libvlc.so* "${VLC_ROOT}/lib/"
          cp -a /usr/lib/${multiarch}/libvlccore.so* "${VLC_ROOT}/lib/"
          cp -a /usr/lib/${multiarch}/vlc/plugins/. "${VLC_ROOT}/plugins/"
          echo "MATRIX_MEDIA_SHARE_CLIENT_BUNDLED_VLC_ROOT=${VLC_ROOT}" >> "$GITHUB_ENV"

      - name: Install Qt
        run: |
          QT_BASE_DIR="${RUNNER_TEMP}/qt"
          python3 -m aqt install-qt --outputdir "${QT_BASE_DIR}" linux_arm64 desktop "${QT_VERSION}" linux_gcc_arm64 --modules qtmultimedia
          QT_ROOT_DIR="${QT_BASE_DIR}/${QT_VERSION}/gcc_arm64"
          echo "QT_ROOT_DIR=${QT_ROOT_DIR}" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=${QT_ROOT_DIR}" >> "$GITHUB_ENV"
          echo "${QT_ROOT_DIR}/bin" >> "$GITHUB_PATH"

      - name: Package AppImage
        run: ARCH=aarch64 ./scripts/package-appimage.sh

      - name: Upload AppImage
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.APP_NAME }}-${{ steps.version.outputs.app_version }}-linux-aarch64-appimage
          path: builds/${{ env.APP_NAME }}-${{ steps.version.outputs.app_version }}-linux-aarch64-appimage.zip
          if-no-files-found: error

  build-windows:
    name: Build Windows (x64)
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Read version
        id: version
        run: |
          $version = (Get-Content VERSION.txt -Raw).Trim()
          "app_version=$version" >> $env:GITHUB_OUTPUT

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install aqtinstall
        run: python -m pip install --user "aqtinstall==3.3.*" "py7zr==1.0.*"

      - name: Download bundled VLC runtime
        run: |
          $vlcZip = Join-Path $env:RUNNER_TEMP "vlc-win64.zip"
          $vlcExtract = Join-Path $env:RUNNER_TEMP "vlc-win64"
          $vlcRoot = Join-Path $env:RUNNER_TEMP "vlc-runtime-win64"
          curl.exe -fL --retry 3 --retry-all-errors "https://mirror.fcix.net/videolan-ftp/vlc/$env:VLC_VERSION/win64/vlc-$env:VLC_VERSION-win64.zip" --output $vlcZip
          Expand-Archive -Path $vlcZip -DestinationPath $vlcExtract -Force
          $sourceRoot = Get-ChildItem -Path $vlcExtract -Directory | Select-Object -First 1
          if (-not $sourceRoot) { throw "Expanded VLC archive did not contain a directory." }
          New-Item -ItemType Directory -Force -Path (Join-Path $vlcRoot "lib") | Out-Null
          Copy-Item (Join-Path $sourceRoot.FullName "*.dll") (Join-Path $vlcRoot "lib") -Force
          Copy-Item (Join-Path $sourceRoot.FullName "plugins") $vlcRoot -Recurse -Force
          "MATRIX_MEDIA_SHARE_CLIENT_BUNDLED_VLC_ROOT=$vlcRoot" >> $env:GITHUB_ENV

      - name: Restore Rust cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('backend/Cargo.lock', 'backend/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Install Qt
        run: |
          $qtBaseDir = Join-Path $env:RUNNER_TEMP "qt"
          python -m aqt install-qt --outputdir $qtBaseDir windows desktop $env:QT_VERSION win64_msvc2022_64 --modules qtmultimedia
          $qtRootDir = Join-Path $qtBaseDir "$env:QT_VERSION\\msvc2022_64"
          "QT_ROOT_DIR=$qtRootDir" >> $env:GITHUB_ENV
          "CMAKE_PREFIX_PATH=$qtRootDir" >> $env:GITHUB_ENV
          (Join-Path $qtRootDir "bin") >> $env:GITHUB_PATH

      - name: Package Windows zip
        run: ./scripts/package-windows.ps1

      - name: Upload Windows zip
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.APP_NAME }}-${{ steps.version.outputs.app_version }}-windows-x64
          path: builds/${{ env.APP_NAME }}-${{ steps.version.outputs.app_version }}-windows-x64.zip
          if-no-files-found: error

  build-windows-arm64:
    name: Build Windows (arm64)
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Read version
        id: version
        run: |
          $version = (Get-Content VERSION.txt -Raw).Trim()
          "app_version=$version" >> $env:GITHUB_OUTPUT

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install aqtinstall
        run: python -m pip install --user "aqtinstall==3.3.*" "py7zr==1.0.*"

      - name: Download bundled VLC runtime
        run: |
          $vlcZip = Join-Path $env:RUNNER_TEMP "vlc-winarm64.zip"
          $vlcExtract = Join-Path $env:RUNNER_TEMP "vlc-winarm64"
          $vlcRoot = Join-Path $env:RUNNER_TEMP "vlc-runtime-winarm64"
          curl.exe -fL --retry 3 --retry-all-errors "https://mirror.fcix.net/videolan-ftp/vlc/$env:VLC_VERSION/winarm64/vlc-$env:VLC_VERSION-winarm64.zip" --output $vlcZip
          Expand-Archive -Path $vlcZip -DestinationPath $vlcExtract -Force
          $sourceRoot = Get-ChildItem -Path $vlcExtract -Directory | Select-Object -First 1
          if (-not $sourceRoot) { throw "Expanded VLC archive did not contain a directory." }
          New-Item -ItemType Directory -Force -Path (Join-Path $vlcRoot "lib") | Out-Null
          Copy-Item (Join-Path $sourceRoot.FullName "*.dll") (Join-Path $vlcRoot "lib") -Force
          Copy-Item (Join-Path $sourceRoot.FullName "plugins") $vlcRoot -Recurse -Force
          "MATRIX_MEDIA_SHARE_CLIENT_BUNDLED_VLC_ROOT=$vlcRoot" >> $env:GITHUB_ENV

      - name: Restore Rust cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('backend/Cargo.lock', 'backend/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Install Qt
        run: |
          $qtBaseDir = Join-Path $env:RUNNER_TEMP "qt"
          python -m aqt install-qt --outputdir $qtBaseDir windows desktop $env:QT_VERSION win64_msvc2022_64 --modules qtmultimedia
          python -m aqt install-qt --outputdir $qtBaseDir windows_arm64 desktop $env:QT_VERSION win64_msvc2022_arm64 --modules qtmultimedia
          $qtHostRootDir = Join-Path $qtBaseDir "$env:QT_VERSION\\msvc2022_64"
          $qtRootDir = Join-Path $qtBaseDir "$env:QT_VERSION\\msvc2022_arm64"
          "QT_HOST_ROOT_DIR=$qtHostRootDir" >> $env:GITHUB_ENV
          "QT_ROOT_DIR=$qtRootDir" >> $env:GITHUB_ENV
          "CMAKE_PREFIX_PATH=$qtRootDir;$qtHostRootDir" >> $env:GITHUB_ENV
          (Join-Path $qtHostRootDir "bin") >> $env:GITHUB_PATH
          (Join-Path $qtRootDir "bin") >> $env:GITHUB_PATH

      - name: Package Windows zip
        run: |
          $env:WINDOWS_ARCH = "arm64"
          ./scripts/package-windows.ps1

      - name: Upload Windows zip
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.APP_NAME }}-${{ steps.version.outputs.app_version }}-windows-arm64
          path: builds/${{ env.APP_NAME }}-${{ steps.version.outputs.app_version }}-windows-arm64.zip
          if-no-files-found: error

  build-macos-arm64:
    name: Build macOS (arm64)
    runs-on: macos-15
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Read version
        id: version
        run: echo "app_version=$(tr -d '\r\n' < VERSION.txt)" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install aqtinstall
        run: python3 -m pip install --user "aqtinstall==3.3.*" "py7zr==1.0.*"

      - name: Download bundled VLC runtime
        run: |
          VLC_DMG="${RUNNER_TEMP}/vlc.dmg"
          VLC_MOUNT="${RUNNER_TEMP}/vlc-mount"
          VLC_APP="${RUNNER_TEMP}/VLC.app"
          curl -L "https://get.videolan.org/vlc/${VLC_VERSION}/macosx/vlc-${VLC_VERSION}-universal.dmg" -o "${VLC_DMG}"
          mkdir -p "${VLC_MOUNT}"
          hdiutil attach "${VLC_DMG}" -mountpoint "${VLC_MOUNT}" -nobrowse -quiet
          cp -R "${VLC_MOUNT}/VLC.app" "${VLC_APP}"
          hdiutil detach "${VLC_MOUNT}" -quiet
          echo "MATRIX_MEDIA_SHARE_CLIENT_BUNDLED_VLC_ROOT=${VLC_APP}/Contents/MacOS" >> "$GITHUB_ENV"

      - name: Restore Rust cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('backend/Cargo.lock', 'backend/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Install Qt
        run: |
          QT_BASE_DIR="${RUNNER_TEMP}/qt"
          python3 -m aqt install-qt --outputdir "${QT_BASE_DIR}" mac desktop "${QT_VERSION}" clang_64 --modules qtmultimedia
          QT_ROOT_DIR="${QT_BASE_DIR}/${QT_VERSION}/macos"
          echo "QT_ROOT_DIR=${QT_ROOT_DIR}" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=${QT_ROOT_DIR}" >> "$GITHUB_ENV"
          echo "${QT_ROOT_DIR}/bin" >> "$GITHUB_PATH"

      - name: Import Developer ID certificate
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: ./scripts/import-apple-signing-cert.sh

      - name: Package macOS app and dmg (unsigned)
        if: github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/v')
        run: ./scripts/package-macos.sh

      - name: Package macOS app and dmg (Developer ID, notarized, stapled)
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        env:
          MACOS_CODESIGN_IDENTITY: "Developer ID Application: BRANDON BROWNING STONE (K6N4J68LTY)"
          MACOS_REQUIRE_NOTARIZATION: "1"
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: ./scripts/package-macos.sh

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.APP_NAME }}-${{ steps.version.outputs.app_version }}-macos-arm64
          path: |
            builds/${{ env.APP_NAME }}-${{ steps.version.outputs.app_version }}-macos-arm64.zip
            builds/${{ env.APP_NAME }}-${{ steps.version.outputs.app_version }}-macos-arm64.dmg
          if-no-files-found: error

      - name: Delete signing keychain
        if: always() && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v'))
        run: |
          if [[ -n "${MACOS_SIGNING_KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "${MACOS_SIGNING_KEYCHAIN_PATH}" || true
          fi
          rm -f "${MACOS_SIGNING_CERTIFICATE_PATH:-}"

  build-macos-intel:
    name: Build macOS (Intel)
    runs-on: macos-15-intel
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}

    steps:
      - name: Check out repository
