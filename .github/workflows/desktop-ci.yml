          hdiutil detach "${VLC_MOUNT}" -quiet
          echo "MATRIX_MEDIA_SHARE_CLIENT_BUNDLED_VLC_ROOT=${VLC_APP}/Contents/MacOS" >> "$GITHUB_ENV"

      - name: Restore Rust cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('backend/Cargo.lock', 'backend/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Install Qt
        run: |
          QT_BASE_DIR="${RUNNER_TEMP}/qt"
          python3 -m aqt install-qt --outputdir "${QT_BASE_DIR}" mac desktop "${QT_VERSION}" clang_64 --modules qtmultimedia
          QT_ROOT_DIR="${QT_BASE_DIR}/${QT_VERSION}/macos"
          echo "QT_ROOT_DIR=${QT_ROOT_DIR}" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=${QT_ROOT_DIR}" >> "$GITHUB_ENV"
          echo "${QT_ROOT_DIR}/bin" >> "$GITHUB_PATH"

      - name: Import Developer ID certificate
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: ./scripts/import-apple-signing-cert.sh

      - name: Package macOS app and dmg (unsigned)
        if: github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/v')
        run: ./scripts/package-macos.sh

      - name: Package macOS app and dmg (Developer ID, notarized, stapled)
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        env:
          MACOS_CODESIGN_IDENTITY: "Developer ID Application: BRANDON BROWNING STONE (K6N4J68LTY)"
          MACOS_REQUIRE_NOTARIZATION: "1"
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: ./scripts/package-macos.sh

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.APP_NAME }}-${{ steps.version.outputs.app_version }}-macos-x86_64
          path: |
            builds/${{ env.APP_NAME }}-${{ steps.version.outputs.app_version }}-macos-x86_64.zip
            builds/${{ env.APP_NAME }}-${{ steps.version.outputs.app_version }}-macos-x86_64.dmg
          if-no-files-found: error

      - name: Delete signing keychain
        if: always() && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v'))
        run: |
          if [[ -n "${MACOS_SIGNING_KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "${MACOS_SIGNING_KEYCHAIN_PATH}" || true
          fi
          rm -f "${MACOS_SIGNING_CERTIFICATE_PATH:-}"

  publish-release:
    name: Publish GitHub release
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-linux
      - build-linux-arm64
      - build-windows
      - build-windows-arm64
      - build-macos-arm64
      - build-macos-intel
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Verify release tag matches VERSION.txt
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION.txt)"
          expected="v${version}"
          if [[ "${GITHUB_REF_NAME}" != "${expected}" ]]; then
            echo "Git tag ${GITHUB_REF_NAME} does not match VERSION.txt (${expected})." >&2
            exit 1
          fi

      - name: Download Linux artifact
        uses: actions/download-artifact@v5
        with:
          name: ${{ env.APP_NAME }}-${{ needs.build-linux.outputs.app_version }}-linux-x86_64-appimage
          path: release-artifacts/linux

      - name: Download Linux ARM64 artifact
        uses: actions/download-artifact@v5
        with:
          name: ${{ env.APP_NAME }}-${{ needs.build-linux-arm64.outputs.app_version }}-linux-aarch64-appimage
          path: release-artifacts/linux-arm64

      - name: Download Windows artifact
        uses: actions/download-artifact@v5
        with:
          name: ${{ env.APP_NAME }}-${{ needs.build-windows.outputs.app_version }}-windows-x64
          path: release-artifacts/windows

      - name: Download Windows ARM64 artifact
        uses: actions/download-artifact@v5
        with:
          name: ${{ env.APP_NAME }}-${{ needs.build-windows-arm64.outputs.app_version }}-windows-arm64
          path: release-artifacts/windows-arm64

      - name: Download macOS ARM64 artifact
        uses: actions/download-artifact@v5
        with:
          name: ${{ env.APP_NAME }}-${{ needs.build-macos-arm64.outputs.app_version }}-macos-arm64
          path: release-artifacts/macos-arm64

      - name: Download macOS Intel artifact
        uses: actions/download-artifact@v5
        with:
          name: ${{ env.APP_NAME }}-${{ needs.build-macos-intel.outputs.app_version }}-macos-x86_64
          path: release-artifacts/macos-x86_64

      - name: Generate Sparkle appcasts
        env:
          SPARKLE_ED25519_PRIVATE_KEY: ${{ secrets.SPARKLE_ED25519_PRIVATE_KEY }}
          APP_VERSION: ${{ needs.build-linux.outputs.app_version }}
        run: |
          set -euo pipefail
          python3 -m pip install --user pynacl
          arm64_zip="$(find release-artifacts/macos-arm64 -name '*-macos-arm64.zip' -print -quit)"
          intel_zip="$(find release-artifacts/macos-x86_64 -name '*-macos-x86_64.zip' -print -quit)"
          if [[ -z "${arm64_zip}" || -z "${intel_zip}" ]]; then
            echo "macOS zip assets are required to sign Sparkle appcasts." >&2
            exit 1
          fi
          mkdir -p release-artifacts/sparkle
          python3 scripts/generate-sparkle-appcast.py \
            --version "${APP_VERSION}" \
            --release-url "https://github.com/${GITHUB_REPOSITORY}/releases/tag/v${APP_VERSION}" \
            --arm64-zip "${arm64_zip}" \
            --x86_64-zip "${intel_zip}" \
            --output-dir release-artifacts/sparkle

      - name: Create or update latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          APP_VERSION: ${{ needs.build-linux.outputs.app_version }}
        run: |
          tag="v${APP_VERSION}"
          title="Matrix Media Share Client ${APP_VERSION}"
          notes="Automated desktop release for ${APP_VERSION}."
          mapfile -d '' assets < <(find release-artifacts -type f -print0)
          if gh release view "${tag}" --repo "${GH_REPO}" >/dev/null 2>&1; then
            gh release edit "${tag}" --repo "${GH_REPO}" --title "${title}" --notes "${notes}" --latest
            gh release upload "${tag}" --repo "${GH_REPO}" "${assets[@]}" --clobber
          else
            gh release create "${tag}" --repo "${GH_REPO}" "${assets[@]}" --title "${title}" --notes "${notes}" --latest --target "${GITHUB_SHA}"
          fi
